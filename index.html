<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人月报 · 扶清 · 80年连载</title>
<meta name="description" content="扶清的个人月报，80年连载。每月一期，从2026年到2106年。">
<meta name="author" content="扶清">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@300;400;700&display=swap');

  :root {
    --bg: #0a0d22;
    --bg-gradient: linear-gradient(135deg, #0a0d22 0%, #1a1f3a 50%, #0d1128 100%);
    --card: rgba(18, 24, 51, 0.75);
    --card-hover: rgba(26, 34, 69, 0.9);
    --text: #e6f7ff;
    --text2: #a0c4e0;
    --text3: #6b8cae;
    --blue: #4dabf7;
    --cyan: #3bc9db;
    --orange: #ffaa55;
    --purple: #7d5fff;
    --border: rgba(77, 171, 247, 0.15);
    --card-border: rgba(77, 171, 247, 0.18);
    --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg-gradient);
    color: var(--text);
    line-height: 1.8;
    overflow-x: hidden;
    min-height: 100vh;
    position: relative;
  }

  /* 星空背景 */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0;
    width: 200%; height: 200%;
    background:
      radial-gradient(circle at 10% 20%, rgba(77,171,247,0.08) 0%, transparent 25%),
      radial-gradient(circle at 90% 80%, rgba(125,95,255,0.1) 0%, transparent 30%),
      radial-gradient(circle at 50% 50%, rgba(255,170,85,0.05) 0%, transparent 35%),
      radial-gradient(circle at 30% 70%, rgba(59,201,219,0.06) 0%, transparent 25%);
    z-index: -3;
    animation: drift 150s linear infinite;
    pointer-events: none;
  }
  @keyframes drift { 0% { transform: translate(0, 0); } 100% { transform: translate(-50%, -50%); } }

  /* 左上角返回链接 */
  .nav-home {
    position: fixed;
    top: 1rem;
    left: 1rem;
    z-index: 100;
    padding: 0.5rem 1.2rem;
    background: rgba(18, 24, 51, 0.85);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(77, 171, 247, 0.25);
    border-radius: 20px;
    color: var(--text2);
    text-decoration: none;
    font-size: 0.85rem;
    transition: var(--transition);
  }
  .nav-home:hover {
    color: var(--orange);
    border-color: rgba(255, 170, 85, 0.5);
  }

  /* 主容器 */
  .main {
    position: relative;
    z-index: 1;
    max-width: 700px;
    margin: 0 auto;
    padding: 6rem 2rem 3rem;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* 标题区 */
  .header {
    text-align: center;
    margin-bottom: 3rem;
    animation: fadeInDown 1s ease;
  }

  @keyframes fadeInDown {
    0% { opacity: 0; transform: translateY(-20px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  .header h1 {
    font-family: 'Noto Serif SC', serif;
    font-size: 2.8rem;
    font-weight: 700;
    background: linear-gradient(135deg, var(--blue), var(--orange));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 0.5rem;
    letter-spacing: 0.15em;
  }

  .header .subtitle {
    font-size: 1rem;
    color: var(--text3);
    letter-spacing: 0.3em;
    font-weight: 300;
  }

  /* 分隔线 */
  .divider {
    width: 80px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(77, 171, 247, 0.35), rgba(255, 170, 85, 0.3), transparent);
    margin: 0 auto 3rem;
    border-radius: 1px;
    position: relative;
  }
  .divider::before {
    content: '✦';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: rgba(255, 170, 85, 0.5);
    font-size: 10px;
    opacity: 0.7;
  }

  /* 期刊列表 */
  .issue-list {
    list-style: none;
    flex: 1;
  }

  .issue-item {
    display: block;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 1.8rem 2rem;
    margin-bottom: 1.2rem;
    text-decoration: none;
    transition: var(--transition);
    animation: fadeInUp 0.8s ease backwards;
    position: relative;
    overflow: hidden;
  }

  .issue-item:nth-child(1) { animation-delay: 0.2s; }
  .issue-item:nth-child(2) { animation-delay: 0.4s; }

  @keyframes fadeInUp {
    0% { opacity: 0; transform: translateY(20px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  .issue-item:hover {
    transform: translateY(-3px);
    background: var(--card-hover);
    border-color: rgba(77, 171, 247, 0.35);
    box-shadow: 0 8px 30px rgba(77, 171, 247, 0.1);
  }

  .issue-item .issue-meta {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    margin-bottom: 0.5rem;
  }

  .issue-item .issue-number {
    font-family: 'Noto Serif SC', serif;
    font-size: 0.75rem;
    color: var(--blue);
    letter-spacing: 0.25em;
    background: rgba(77, 171, 247, 0.1);
    border: 1px solid rgba(77, 171, 247, 0.25);
    padding: 0.15rem 0.6rem;
    border-radius: 6px;
    font-weight: 700;
  }

  .issue-item .issue-date {
    font-size: 0.8rem;
    color: var(--text3);
    letter-spacing: 0.1em;
  }

  .issue-item .badge-latest {
    font-size: 0.65rem;
    background: linear-gradient(135deg, rgba(255,170,85,0.2), rgba(255,102,170,0.2));
    color: var(--orange);
    border: 1px solid rgba(255, 170, 85, 0.35);
    padding: 0.1rem 0.5rem;
    border-radius: 4px;
    font-weight: 700;
    letter-spacing: 0.1em;
    animation: pulse-badge 2s infinite;
  }

  @keyframes pulse-badge {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }

  .issue-item .issue-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 0.3rem;
    transition: var(--transition);
  }

  .issue-item:hover .issue-title {
    color: var(--orange);
  }

  .issue-item .issue-hint {
    font-size: 0.85rem;
    color: var(--text3);
  }

  /* 页脚 */
  .footer {
    text-align: center;
    padding: 3rem 2rem 2rem;
    border-top: 1px solid var(--border);
    margin-top: 3rem;
  }

  .footer .declaration {
    font-family: 'Noto Serif SC', serif;
    font-size: 1rem;
    color: var(--text2);
    margin-bottom: 1rem;
    line-height: 2;
  }

  .footer .copyright {
    font-size: 0.8rem;
    color: var(--text3);
  }

  /* 滚动条 */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: rgba(77, 171, 247, 0.2); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(77, 171, 247, 0.35); }

  /* 响应式 */
  @media (max-width: 768px) {
    .header h1 { font-size: 2.2rem; }
    .main { padding: 5rem 1.5rem 2rem; }
    .issue-item { padding: 1.5rem 1.5rem; }
    .issue-item .issue-title { font-size: 1.2rem; }
  }
  @media (max-width: 480px) {
    .header h1 { font-size: 1.8rem; }
    .header .subtitle { font-size: 0.85rem; letter-spacing: 0.2em; }
    .main { padding: 4.5rem 1rem 1.5rem; }
    .issue-item { padding: 1.2rem 1.2rem; }
    .issue-item .issue-title { font-size: 1.1rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .header, .issue-item { animation: none; opacity: 1; transform: none; }
    .issue-item { transition: none; }
    .badge-latest { animation: none; }
  }
</style>
</head>
<body>
